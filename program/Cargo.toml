[package]
name = "light-compressed-claim"
version = "0.1.0"
description = "Light Protocol Compressed Claim"
authors = ["Light Protocol maintainers <info@lightprotocol.io>"]
repository = "https://github.com/lightprotocol/light-protocol"
license = "Apache-2.0"
edition = "2021"

[features]
no-entrypoint = []
test-sbf = []
cpi = []

default = ["cpi"]

[dependencies]
solana-program = "2.2"
light-compressed-account = { version = "0.7.0", features = ["anchor"] }
light-ctoken-sdk = { version = "0.2.1", features = ["anchor"] }
light-ctoken-interface = { version = "0.1.1", features = ["anchor"] }
thiserror = "2.0.11"
borsh = "0.10.0"

[dev-dependencies]
solana-sdk = "2.2"
light-compressed-token = { version = "2.0.0", features = ["no-entrypoint"] }
light-program-test = { version = "0.17.1", features = ["v2"] }
solana-program-test = "2.2"
light-client = { version = "0.17.2", features = ["v2"] }

spl-token = { version = "5.0.0", features = ["no-entrypoint"] }

[lib]
crate-type = ["cdylib", "lib"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = ['cfg(target_os, values("solana"))']


